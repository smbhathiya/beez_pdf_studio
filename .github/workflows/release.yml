# Builds the Windows app and publishes a GitHub Release whenever a version tag is pushed:
#
#   git tag v0.2.0 && git push origin v0.2.0
#
# The release asset name contains the target triple and the zip holds `util_bee.exe`,
# which is exactly what the in-app updater (src/updater.rs) looks for.

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Check tag matches Cargo.toml version
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"(.+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} does not match Cargo.toml version $version"
          }

      - name: Test
        run: cargo test --release

      - name: Build
        run: cargo build --release

      - name: Package
        shell: pwsh
        run: |
          $asset = "UtilBee-PDF-Studio-${{ github.ref_name }}-x86_64-pc-windows-msvc.zip"
          Compress-Archive -Path target/release/util_bee.exe -DestinationPath $asset
          "ASSET=$asset" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" "$env:ASSET" `
            --title "UtilBee PDF Studio ${{ github.ref_name }}" `
            --generate-notes
